<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | CSV Viewer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="auth-page">


    <div class="auth-box">


        <div class="logo">
            C
        </div>


        <h1>
            Welcome back
        </h1>


        <p class="auth-subtitle">
            Sign in to access your CSV workspace
        </p>


        <form method="POST"
              action="/login">


            <label for="username">
                Username
            </label>


            <input
                type="text"
                name="username"
                id="username"
                placeholder="Enter your username"
                required
            >


            <label for="password">
                Password
            </label>


            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-btn"
            >
                Sign in
            </button>


        </form>


        <div class="divider">
            OR
        </div>


        <a href="/signin/google">

            <button
                type="button"
                class="google-btn"
            >
                Continue with Google
            </button>

        </a>


        <p class="auth-footer">

            Don't have an account?

            <a href="/register">
                Create an account
            </a>

        </p>


    </div>


</div>


</body>

</html>
