<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | CSV Viewer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <main class="auth-page">

        <div class="auth-box">

            <div class="logo">
                C
            </div>


            <h1>
                Create account
            </h1>


            <p class="auth-subtitle">
                Create your account and start exploring your data
            </p>


            <form method="POST" action="/register">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    placeholder="Choose a username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create account
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="/">
                    Sign in
                </a>

            </p>

        </div>

    </main>

</body>

</html>
